<!DOCTYPE html>
<html>
<head>
    <title>Add User</title>
    <style>
        /* ---- page background ---- */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Segoe UI, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* ---- the white card holding the form ---- */
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        h2 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #333333;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #555555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;   /* keeps padding inside the width */
        }

        /* highlight the box the user is typing in */
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
        }

        .link {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #667eea;
        }
    </style>
</head>
<body>

    <div class="card">

        <h2>Add a New User</h2>

        <form action="/users" method="post">

            <label>Name</label>
            <input type="text" name="name" placeholder="Enter name" required>

            <label>Age</label>
            <input type="number" name="age" placeholder="Enter age" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter email" required>

            <button type="submit">Submit</button>

        </form>

        <a class="link" href="/users">See all users</a>

    </div>

</body>
</html>
